# ============================================================
# HEDEFMATIK.COM - NGINX PRODUCTION REVERSE PROXY & STATIC CONFIG
# (Hostinger VPS / Cloud Sunucular için)
# ============================================================

server {
    listen 80;
    server_name hedefmatik.com www.hedefmatik.com;

    # Let's Encrypt SSL sertifikası aldıktan sonra certbot otomatik HTTPS bloğu ekler
    # veya aşağıdaki yönlendirmeyi açabilirsiniz:
    # return 301 https://$host$request_uri;

    root /var/www/hedefmatik/dist;
    index index.html;

    # Gzip Sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA Yönlendirmesi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy (FastAPI Uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Uploads / Medya Dosyaları
    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Statik Dosya Önbellekleme
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
